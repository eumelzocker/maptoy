services:
  maptoy:
    build:
      context: .
    env_file:
      - .env
    environment:
      MAPTOY_DATA_DIR: /data
      MAPTOY_HOST: 0.0.0.0
      MAPTOY_LOG_LEVEL: ${MAPTOY_LOG_LEVEL:-info}
      MAPTOY_API_TRAFFIC_LOG_DIR: /logs/api
      MAPTOY_PROVIDER_TRAFFIC_LOG_DIR: /logs/provider
      MAPTOY_TRAFFIC_LOG_MAX_BYTES: ${MAPTOY_TRAFFIC_LOG_MAX_BYTES:-10485760}
      MAPTOY_TRAFFIC_LOG_MAX_FILES: ${MAPTOY_TRAFFIC_LOG_MAX_FILES:-5}
      MAPTOY_PORT: ${MAPTOY_PORT:-4004}
    ports:
      - "${MAPTOY_PORT:-4004}:${MAPTOY_PORT:-4004}"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${MAPTOY_DATA_DIR:-./.data}
        target: /data
      - type: bind
        source: ${MAPTOY_API_TRAFFIC_LOG_DIR:-${MAPTOY_DATA_DIR:-./.data}/logs/api}
        target: /logs/api
      - type: bind
        source: ${MAPTOY_PROVIDER_TRAFFIC_LOG_DIR:-${MAPTOY_DATA_DIR:-./.data}/logs/provider}
        target: /logs/provider
